<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>WarHook: UFO Abduction</title>
    <base href="./" />
    <link href="css/app.css" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
</head>

<body>

    <div id="app">
        <div id="loading" role="status" aria-live="polite">
            <canvas id="loadingCanvas" width="384" height="216" aria-label="WarHook loading"></canvas>
        </div>
    </div>

    <button id="fullscreenButton" type="button" aria-label="Enter fullscreen">
        FULLSCREEN
    </button>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">x</a>
    </div>

    <script>
        // localStorage bridge for the high-score store ([JSImport] targets).
        window.warhookInterop = {
            loadSave: function (key) { return localStorage.getItem(key); },
            saveSave: function (key, json) { localStorage.setItem(key, json); }
        };

        // Wrap AudioContext so the game's context (created before any user
        // gesture) can be resumed on the first click or key press.
        (function () {
            var real = window.AudioContext || window.webkitAudioContext;
            if (!real) return;
            var contexts = [];
            function PatchedAudioContext() {
                var ctx = new real();
                contexts.push(ctx);
                return ctx;
            }
            PatchedAudioContext.prototype = real.prototype;
            window.AudioContext = PatchedAudioContext;
            window.warhookUnlockAudio = function () {
                for (var i = 0; i < contexts.length; i++) {
                    try {
                        if (contexts[i].state === 'suspended') {
                            var resume = contexts[i].resume();
                            // resume() is promise based; a browser can still
                            // reject it if the gesture is not accepted.
                            if (resume && resume.catch) resume.catch(function () { });
                        }
                    } catch (e) { }
                }
            };
        })();

        // nkast.Wasm.Dom's media bridge calls HTMLMediaElement.play() without
        // observing its promise. Autoplay policy therefore reports a rejected
        // promise as an uncaught browser error. Attach a rejection handler at
        // the platform boundary while preserving the native return value.
        (function () {
            if (!window.HTMLMediaElement || !HTMLMediaElement.prototype.play) return;
            var nativePlay = HTMLMediaElement.prototype.play;
            HTMLMediaElement.prototype.play = function () {
                try {
                    var result = nativePlay.call(this);
                    if (result && result.catch) result.catch(function () { });
                    return result;
                } catch (e) {
                    // Keep the bridge non-throwing for browsers that reject
                    // synchronously; the next user gesture will retry music.
                    return Promise.resolve();
                }
            };
        })();
    </script>

    <script src="keyboard-controls.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>

    <script src="_content/nkast.Wasm.JSInterop/js/JSObject.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Window.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Document.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Navigator.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Gamepad.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Media.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.XHR/js/XHR.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/Canvas.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/CanvasGLContext.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Audio/js/Audio.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.XR/js/XR.10.0.3.js"></script>

    <script>
        // Draw the boot screen from the same 8x8 atlas used by the game's
        // main menu. Blazor replaces #loading when the game component starts.
        (function () {
            var canvas = document.getElementById('loadingCanvas');
            var loading = document.getElementById('loading');
            if (!canvas || !loading) return;
            var context = canvas.getContext('2d');
            var atlas = new Image();
            var atlasReady = false;
            var started = performance.now();
            var progress = 4;
            var phases = [
                'Loading WebAssembly',
                'Loading game assets',
                'Preparing graphics',
                'Starting WarHook'
            ];

            atlas.onload = function () {
                atlasReady = true;
                draw();
            };
            atlas.src = 'Assets/font8x8_atlas.png';

            function drawText(text, x, y, scale, color) {
                if (!atlasReady) return;
                context.save();
                context.imageSmoothingEnabled = false;
                context.globalAlpha = 1;
                for (var i = 0; i < text.length; i++) {
                    var code = text.charCodeAt(i) - 32;
                    if (code < 0 || code >= 95) code = '?' .charCodeAt(0) - 32;
                    var sourceX = (code % 16) * 8;
                    var sourceY = Math.floor(code / 16) * 8;
                    context.drawImage(atlas, sourceX, sourceY, 8, 8,
                        x + i * 8 * scale, y, 8 * scale, 8 * scale);
                }
                context.restore();
            }

            function centered(text, y, scale, color) {
                drawText(text, (canvas.width - text.length * 8 * scale) / 2, y, scale, color);
            }

            function draw() {
                context.fillStyle = '#050604';
                context.fillRect(0, 0, canvas.width, canvas.height);

                var dots = '.'.repeat(1 + Math.floor((performance.now() - started) / 400) % 3);
                centered('Loading' + dots, 55, 3, '#ffe191');

                var barX = 36, barY = 105, barWidth = canvas.width - 72, barHeight = 9;
                context.fillStyle = '#382d17';
                context.fillRect(barX, barY, barWidth, barHeight);
                context.strokeStyle = '#ffe191';
                context.lineWidth = 1;
                context.strokeRect(barX + .5, barY + .5, barWidth - 1, barHeight - 1);
                context.fillStyle = '#ffe191';
                context.fillRect(barX + 2, barY + 2,
                    Math.max(0, (barWidth - 4) * progress / 100), barHeight - 4);

                var phase = phases[Math.min(phases.length - 1,
                    Math.floor((performance.now() - started) / 3000))];
                centered(phase, 132, 1, '#ffffff');
            }

            function animate(now) {
                if (!document.body.contains(loading)) return;
                // Keep the bar moving toward completion without pretending that
                // the browser can report a byte-perfect Blazor download here.
                progress = Math.min(94, 4 + (now - started) / 12000 * 90);
                draw();
                window.requestAnimationFrame(animate);
            }

            var observer = new MutationObserver(function () {
                if (document.getElementById('theCanvas')) {
                    progress = 100;
                    draw();
                    observer.disconnect();
                }
            });
            observer.observe(document.getElementById('app'), { childList: true, subtree: true });
            window.requestAnimationFrame(animate);
        })();

        function tickJS()
        {
            window.theInstance.invokeMethod('TickDotNet');
            window.requestAnimationFrame(tickJS);
        }

        window.initRenderJS = (instance) =>
        {
            window.theInstance = instance;

            // set initial canvas size
            resizeGameCanvas();
            var canvas = document.getElementById('theCanvas');
            // disable context menu on right click
            canvas.addEventListener("contextmenu", e => e.preventDefault());

            // begin game loop
            window.requestAnimationFrame(tickJS);

            // Browsers start with audio suspended until a user gesture. On the
            // first click/keypress, resume the WebAudio context and let the
            // game retry its active music track if autoplay was blocked.
            var audioGestureSeen = false;
            var unlock = function () {
                audioGestureSeen = true;
                if (window.warhookUnlockAudio) window.warhookUnlockAudio();
                if (window.theInstance)
                    window.theInstance.invokeMethod('UnlockAudioDotNet');
            };
            // Capture events so clicking the fullscreen button, loading
            // screen, or any other page element unlocks audio—not just the
            // game canvas. Keep these listeners installed because the first
            // gesture can happen before the music file has finished loading.
            document.addEventListener('pointerdown', unlock, true);
            document.addEventListener('keydown', unlock, true);
            // A tab may suspend media after it has been backgrounded. Retry
            // only after an actual gesture has already unlocked the page;
            // focus/visibility alone must never start autoplay.
            window.addEventListener('focus', function () {
                if (audioGestureSeen) unlock();
            });
            document.addEventListener('visibilitychange', function () {
                if (audioGestureSeen && document.visibilityState === 'visible') unlock();
            });
        };

        function resizeGameCanvas() {
            var canvas = document.getElementById('theCanvas');
            var holder = document.getElementById('canvasHolder');
            if (!canvas || !holder || holder.clientWidth <= 0 || holder.clientHeight <= 0) return;
            canvas.width = holder.clientWidth;
            canvas.height = holder.clientHeight;
        }

        (function () {
            var button = document.getElementById('fullscreenButton');
            if (!button) return;

            function fullscreenElement() {
                return document.fullscreenElement || document.webkitFullscreenElement;
            }

            function updateButton() {
                var active = !!fullscreenElement();
                button.textContent = active ? 'EXIT FULLSCREEN' : 'FULLSCREEN';
                button.setAttribute('aria-label', active ? 'Exit fullscreen' : 'Enter fullscreen');
            }

            button.addEventListener('click', function () {
                var root = document.documentElement;
                if (fullscreenElement()) {
                    var exit = document.exitFullscreen || document.webkitExitFullscreen;
                    if (exit) exit.call(document);
                    return;
                }

                var request = root.requestFullscreen || root.webkitRequestFullscreen;
                if (request) {
                    var result = request.call(root);
                    if (result && result.catch) result.catch(function () { });
                }
            });

            document.addEventListener('fullscreenchange', function () {
                updateButton();
                resizeGameCanvas();
            });
            document.addEventListener('webkitfullscreenchange', function () {
                updateButton();
                resizeGameCanvas();
            });
            window.addEventListener('resize', resizeGameCanvas);
            updateButton();
        })();

        window.addEventListener("keydown", function(event)
        {
            // Prevent Arrows Keys and Spacebar scrolling the outer page
            // when running inside an iframe. e.g: itch.io embedding.
            if ([32, 37, 38, 39, 40].indexOf(event.keyCode) > -1)
                event.preventDefault();
        });
        window.addEventListener("wheel", function(event)
        {
            // Prevent Mousewheel scrolling the outer page
            // when running inside an iframe. e.g: itch.io embedding.
            event.preventDefault();
        }, { passive: false });

        // Start Blazor after KNI's browser-side modules have loaded.
        Blazor.start();
    </script>
</body>

</html>
